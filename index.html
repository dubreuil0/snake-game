<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yılan Oyunu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  html, body { margin: 0; }
  /* Layout: tek sütun, ortada bir "cihaz". Üstte skor çubuğu, ortada LCD ekran, altta dokunmatik yön tuşları. */
  :root {
    --case: #2a2f25;
    --case-edge: #3a4132;
    --lcd: #c4d19b;
    --lcd-grid: #b9c78f;
    --ink: #26331b;
    --label: #aab59a;
    --font-display: "Press Start 2P", "Courier New", monospace;
    --font-body: "VT323", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: auto; }
  body {
    background: var(--case);
    color: var(--label);
    font-family: var(--font-body);
    font-size: 22px;
    padding-block: 20px 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: center;
  }
  .device {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.08em;
    color: var(--lcd);
    text-wrap: balance;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }
  .scores { display: flex; gap: 20px; }
  .score { display: flex; flex-direction: column; line-height: 1; gap: 4px; }
  .score span:first-child {
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--label);
  }
  .score span:last-child {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--lcd);
    font-variant-numeric: tabular-nums;
  }
  .screen {
    position: relative;
    border: 6px solid var(--case-edge);
    border-radius: 6px;
    background: var(--lcd);
    line-height: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    touch-action: none;
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    text-align: center;
    background: rgba(196, 209, 155, 0.86);
    color: var(--ink);
    line-height: 1.1;
  }
  .overlay[hidden] { display: none !important; }
  .overlay h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    text-wrap: balance;
  }
  .overlay p { margin: 0; font-size: 22px; max-width: 28ch; }
  .overlay button {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--lcd);
    background: var(--ink);
    border: 0;
    border-radius: 4px;
    padding: 12px 18px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--lcd); outline-offset: 3px; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(2, 64px);
    gap: 8px;
    justify-content: center;
  }
  .pad button {
    background: var(--case-edge);
    color: var(--lcd);
    border: 0;
    border-radius: 6px;
    font-family: var(--font-display);
    font-size: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pad button:active { background: #4a5340; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .hint { margin: 0; font-size: 20px; line-height: 1.2; color: var(--label); }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<main class="device">
  <div class="bar">
    <h1>YILAN</h1>
    <div class="scores">
      <div class="score"><span>Skor</span><span id="score">000</span></div>
      <div class="score"><span>Rekor</span><span id="best">000</span></div>
    </div>
  </div>

  <div class="screen">
    <canvas id="board" width="400" height="400" aria-label="Yılan oyunu alanı"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">HAZIR MISIN?</h2>
      <p id="ovText">Elmaları ye, duvara ve kendi kuyruğuna çarpma.</p>
      <button id="start" type="button">BAŞLA</button>
    </div>
  </div>

  <div class="pad" aria-label="Yön tuşları">
    <button class="up" type="button" data-dir="up" aria-label="Yukarı">▲</button>
    <button class="left" type="button" data-dir="left" aria-label="Sola">◀</button>
    <button class="down" type="button" data-dir="down" aria-label="Aşağı">▼</button>
    <button class="right" type="button" data-dir="right" aria-label="Sağa">▶</button>
  </div>

  <p class="hint">Ok tuşları ya da WASD ile yönlendir. Boşluk: duraklat. Telefonda ekranda parmağınla kaydır.</p>
</main>

<script>
/*CORE*/
var N = 20;
var DIRS = {
  up: { x: 0, y: -1 },
  down: { x: 0, y: 1 },
  left: { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

function placeFood(snake, rng) {
  var taken = {};
  for (var i = 0; i < snake.length; i++) taken[snake[i].x + ',' + snake[i].y] = 1;
  var free = [];
  for (var y = 0; y < N; y++) {
    for (var x = 0; x < N; x++) {
      if (!taken[x + ',' + y]) free.push({ x: x, y: y });
    }
  }
  if (!free.length) return null;
  return free[Math.floor(rng() * free.length)];
}

function newState(rng) {
  var snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  return { snake: snake, dir: DIRS.right, food: placeFood(snake, rng), score: 0, status: 'ok' };
}

function step(s, want, rng) {
  if (s.status !== 'ok') return s;
  var d = s.dir;
  if (want && !(want.x === -d.x && want.y === -d.y)) d = want;
  s.dir = d;
  var h = s.snake[0];
  var nh = { x: h.x + d.x, y: h.y + d.y };
  if (nh.x < 0 || nh.y < 0 || nh.x >= N || nh.y >= N) { s.status = 'dead'; return s; }
  var ate = !!s.food && nh.x === s.food.x && nh.y === s.food.y;
  var body = ate ? s.snake : s.snake.slice(0, -1);
  for (var i = 0; i < body.length; i++) {
    if (body[i].x === nh.x && body[i].y === nh.y) { s.status = 'dead'; return s; }
  }
  s.snake = [nh].concat(body);
  if (ate) {
    s.score++;
    s.food = placeFood(s.snake, rng);
    if (!s.food) s.status = 'won';
  }
  return s;
}
/*ENDCORE*/

(function () {
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var startBtn = document.getElementById('start');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var CELL = canvas.width / N;
  var COL = { bg: '#c4d19b', grid: '#b9c78f', ink: '#26331b' };

  var state = newState(Math.random);
  var mode = 'ready'; // ready | playing | paused | over
  var queue = [];
  var timer = null;
  var best = 0;
  try { best = parseInt(localStorage.getItem('yilan-best') || '0', 10) || 0; } catch (e) {}

  function pad3(n) { return String(n).padStart(3, '0'); }

  function draw() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = COL.grid;
    for (var i = 1; i < N; i++) {
      ctx.fillRect(i * CELL, 0, 1, canvas.height);
      ctx.fillRect(0, i * CELL, canvas.width, 1);
    }
    ctx.fillStyle = COL.ink;
    var s = state.snake;
    for (var k = 0; k < s.length; k++) {
      ctx.fillRect(s[k].x * CELL + 1, s[k].y * CELL + 1, CELL - 2, CELL - 2);
    }
    var h = s[0];
    ctx.fillStyle = COL.bg;
    ctx.fillRect(h.x * CELL + CELL / 2 - 2, h.y * CELL + CELL / 2 - 2, 4, 4);
    if (state.food) {
      var fx = state.food.x * CELL, fy = state.food.y * CELL, u = CELL / 4;
      ctx.fillStyle = COL.ink;
      ctx.fillRect(fx + u, fy + 1, u * 2, CELL - 2);
      ctx.fillRect(fx + 1, fy + u, CELL - 2, u * 2);
    }
  }

  function updateScores() {
    scoreEl.textContent = pad3(state.score);
    bestEl.textContent = pad3(best);
  }

  function interval() { return Math.max(65, 140 - state.score * 4); }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.hidden = false;
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, interval());
  }

  function tick() {
    if (mode !== 'playing') return;
    var want = queue.shift() || null;
    step(state, want, Math.random);
    draw();
    updateScores();
    if (state.status === 'dead' || state.status === 'won') {
      mode = 'over';
      if (state.score > best) {
        best = state.score;
        try { localStorage.setItem('yilan-best', String(best)); } catch (e) {}
        updateScores();
      }
      if (state.status === 'won') showOverlay('KAZANDIN!', 'Bütün alanı doldurdun. Skor: ' + state.score, 'TEKRAR');
      else showOverlay('OYUN BİTTİ', 'Skorun: ' + state.score + (state.score && state.score >= best ? ' (rekor)' : ''), 'TEKRAR');
      return;
    }
    schedule();
  }

  function restart() {
    state = newState(Math.random);
    queue = [];
    draw();
    updateScores();
  }

  function play() {
    if (mode === 'over') restart();
    mode = 'playing';
    overlay.hidden = true;
    schedule();
  }

  function pause() {
    if (mode !== 'playing') return;
    mode = 'paused';
    clearTimeout(timer);
    showOverlay('DURAKLATILDI', 'Devam etmek için boşluğa bas.', 'DEVAM');
  }

  function toggle() {
    if (mode === 'playing') pause(); else play();
  }

  function turn(name) {
    var d = DIRS[name];
    var last = queue.length ? queue[queue.length - 1] : state.dir;
    if (d.x === last.x && d.y === last.y) return;
    if (d.x === -last.x && d.y === -last.y) return;
    if (queue.length < 2) queue.push(d);
    if (mode === 'ready' || mode === 'paused') play();
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); toggle(); return; }
    var name = KEYS[e.key];
    if (name) { e.preventDefault(); if (mode === 'over') return; turn(name); }
  });

  startBtn.addEventListener('click', play);

  Array.prototype.forEach.call(document.querySelectorAll('.pad button'), function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (mode !== 'over') turn(b.getAttribute('data-dir'));
    });
  });

  var sx = 0, sy = 0, touching = false;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    sx = t.clientX; sy = t.clientY; touching = true;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    if (!touching) return;
    touching = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (mode === 'over') return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 'right' : 'left');
    else turn(dy > 0 ? 'down' : 'up');
  }, { passive: false });

  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });

  draw();
  updateScores();
})();
</script>
</body>
</html>
